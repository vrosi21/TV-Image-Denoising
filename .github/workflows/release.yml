name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Releases (yes/no)"
        required: false
        default: "no"
      release_tag:
        description: "Tag name for the Release (required if publishing, e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

env:
  APP_NAME: TVDenoising
  SDK_VER:  4.2.1
  SDK_DATE: 20260710

jobs:

# ──────────────────────────────────────────────────────────────────
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install natID SDK
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/idzafic/natID.git %USERPROFILE%\natID
          mklink /J %USERPROFILE%\natID.SDK   %USERPROFILE%\natID\natID.SDK
          mklink /J %USERPROFILE%\natID.Utils %USERPROFILE%\natID\natID.Utils
          curl -L -o %TEMP%\sdk-bin.7z https://github.com/idzafic/natID/releases/download/v%SDK_VER%/bin_win_x64_%SDK_DATE%.7z
          dir %TEMP%\sdk-bin.7z

      - name: Extract SDK libs
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          & "C:\Program Files\7-Zip\7z.exe" x -y "-o$env:USERPROFILE\natID.SDK\bin" "$env:TEMP\sdk-bin.7z"
          Get-ChildItem "$env:USERPROFILE\natID.SDK\bin" -Filter *.dll | Select-Object -First 5 Name

      - name: Setup RAMDisk and project symlink
        shell: cmd
        run: |
          if not exist %USERPROFILE%\natID.RAMDisk mkdir %USERPROFILE%\natID.RAMDisk
          if not exist R:\ subst R: %USERPROFILE%\natID.RAMDisk
          mkdir %USERPROFILE%\Desktop 2>nul
          mklink /J %USERPROFILE%\Desktop\TVDenoising %GITHUB_WORKSPACE%

      - name: Build (Release)
        shell: cmd
        run: |
          set HOME=%USERPROFILE%
          cmake -S Implementation -B %USERPROFILE%\natID.RAMDisk\build
          cmake --build %USERPROFILE%\natID.RAMDisk\build --config Release
          dir R:\Out\TVDenoising\Release

      - name: Collect installer (SetupCollector)
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          xcopy /E /I "$env:USERPROFILE\natID.SDK\DevEnv\SetupCollectors" "$env:USERPROFILE\Setups"
          Copy-Item "$env:GITHUB_WORKSPACE\packaging\TVDenoising.xml" "$env:USERPROFILE\Setups\"
          # Override SDK's GTK4.xml with our patched version (matches actual bin layout)
          Copy-Item "$env:GITHUB_WORKSPACE\packaging\GTK4.xml" "$env:USERPROFILE\natID.SDK\DevEnv\SetupCollectors\Packages\GTK4.xml" -Force
          Write-Host "--- GTK4.xml Group paths after overwrite ---"
          Select-String -Path "$env:USERPROFILE\natID.SDK\DevEnv\SetupCollectors\Packages\GTK4.xml" -Pattern 'path="' | ForEach-Object { $_.Line.Trim() }
          & "$env:USERPROFILE\natID.Utils\windows\SetupCollector.exe" "$env:USERPROFILE\Setups\TVDenoising.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "dir /s /b R:\Setup\TVDenoising"

      - name: Stage and zip installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          Get-ChildItem "R:\Setup" -File -Recurse -Include *.msi,"Install*.exe" |
            Copy-Item -Destination installer-output
          Get-ChildItem installer-output
          if (-not (Get-ChildItem installer-output -Filter *.msi)) {
            Write-Error "No .msi produced"
            exit 1
          }
          Compress-Archive -Path installer-output/* -DestinationPath TVDenoising-win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TVDenoising-win
          path: TVDenoising-win.zip
          if-no-files-found: error

# ──────────────────────────────────────────────────────────────────
  macos-silicon:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install natID SDK
        run: |
          git clone --depth 1 https://github.com/idzafic/natID.git $HOME/natID
          ln -s $HOME/natID/natID.SDK   $HOME/natID.SDK
          ln -s $HOME/natID/natID.Utils $HOME/natID.Utils
          brew install sevenzip
          curl -L -o /tmp/sdk-bin.7z \
            https://github.com/idzafic/natID/releases/download/v${SDK_VER}/bin_macOS_arm64_${SDK_DATE}.7z
          7zz x -y -o$HOME/natID.SDK/bin /tmp/sdk-bin.7z
          ls $HOME/natID.SDK/bin/lib/

      - name: Setup RAMDisk and project symlink
        run: |
          mkdir -p $HOME/natID.RAMDisk/Out
          mkdir -p ~/Desktop
          ln -s "$GITHUB_WORKSPACE" ~/Desktop/TVDenoising

      - name: Build (Release)
        run: |
          cmake -S Implementation -B $HOME/natID.RAMDisk/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build $HOME/natID.RAMDisk/build -j

      - name: Collect installer (SetupCollector)
        run: |
          sudo ln -s $HOME/natID.RAMDisk /Volumes/RAMDisk
          cp -r $HOME/natID/natID.SDK/DevEnv/SetupCollectors $HOME/Setups
          cp "$GITHUB_WORKSPACE/packaging/TVDenoising.xml" $HOME/Setups/
          chmod +x $HOME/natID/natID.Utils/macOS/arm64/SetupCollector
          $HOME/natID/natID.Utils/macOS/arm64/SetupCollector $HOME/Setups/TVDenoising.xml
          find $HOME/natID.RAMDisk/Setup -maxdepth 4

      - name: Stage installer output
        run: |
          mkdir -p "$GITHUB_WORKSPACE/installer-output"
          cp -R $HOME/natID.RAMDisk/Setup/ALL_Bundles/* "$GITHUB_WORKSPACE/installer-output/" 2>/dev/null || \
            cp -R $HOME/natID.RAMDisk/Setup/TVDenoising/* "$GITHUB_WORKSPACE/installer-output/" 2>/dev/null || \
            echo "WARNING: no installer output found"
          ls -laR "$GITHUB_WORKSPACE/installer-output/"

      - name: Re-sign and clear quarantine
        run: |
          codesign --force --deep --sign - "$GITHUB_WORKSPACE/installer-output/TVDenoising.app"
          xattr -cr "$GITHUB_WORKSPACE/installer-output/TVDenoising.app"

      - name: Zip .app
        run: |
          cd "$GITHUB_WORKSPACE/installer-output"
          ditto -c -k --keepParent --sequesterRsrc TVDenoising.app TVDenoising-macOS-Silicon.zip
          xattr -c TVDenoising-macOS-Silicon.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TVDenoising-macOS-Silicon
          path: installer-output/TVDenoising-macOS-Silicon.zip
          if-no-files-found: error

# ──────────────────────────────────────────────────────────────────
  macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install natID SDK
        run: |
          git clone --depth 1 https://github.com/idzafic/natID.git $HOME/natID
          ln -s $HOME/natID/natID.SDK   $HOME/natID.SDK
          ln -s $HOME/natID/natID.Utils $HOME/natID.Utils
          brew install sevenzip
          curl -L -o /tmp/sdk-bin.7z \
            https://github.com/idzafic/natID/releases/download/v${SDK_VER}/bin_macOS_x64_${SDK_DATE}.7z
          7zz x -y -o$HOME/natID.SDK/bin /tmp/sdk-bin.7z
          ls $HOME/natID.SDK/bin/lib/

      - name: Setup RAMDisk and project symlink
        run: |
          mkdir -p $HOME/natID.RAMDisk/Out
          mkdir -p ~/Desktop
          ln -s "$GITHUB_WORKSPACE" ~/Desktop/TVDenoising

      - name: Build (Release)
        run: |
          cmake -S Implementation -B $HOME/natID.RAMDisk/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build $HOME/natID.RAMDisk/build -j

      - name: Collect installer (SetupCollector)
        run: |
          sudo ln -s $HOME/natID.RAMDisk /Volumes/RAMDisk
          cp -r $HOME/natID/natID.SDK/DevEnv/SetupCollectors $HOME/Setups
          cp "$GITHUB_WORKSPACE/packaging/TVDenoising.xml" $HOME/Setups/
          chmod +x $HOME/natID/natID.Utils/macOS/x64/SetupCollector
          $HOME/natID/natID.Utils/macOS/x64/SetupCollector $HOME/Setups/TVDenoising.xml
          find $HOME/natID.RAMDisk/Setup -maxdepth 4

      - name: Stage installer output
        run: |
          mkdir -p "$GITHUB_WORKSPACE/installer-output"
          cp -R $HOME/natID.RAMDisk/Setup/ALL_Bundles/* "$GITHUB_WORKSPACE/installer-output/" 2>/dev/null || \
            cp -R $HOME/natID.RAMDisk/Setup/TVDenoising/* "$GITHUB_WORKSPACE/installer-output/" 2>/dev/null || \
            echo "WARNING: no installer output found"
          ls -laR "$GITHUB_WORKSPACE/installer-output/"

      - name: Re-sign and clear quarantine
        run: |
          codesign --force --deep --sign - "$GITHUB_WORKSPACE/installer-output/TVDenoising.app"
          xattr -cr "$GITHUB_WORKSPACE/installer-output/TVDenoising.app"

      - name: Zip .app
        run: |
          cd "$GITHUB_WORKSPACE/installer-output"
          ditto -c -k --keepParent --sequesterRsrc TVDenoising.app TVDenoising-macOS-Intel.zip
          xattr -c TVDenoising-macOS-Intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TVDenoising-macOS-Intel
          path: installer-output/TVDenoising-macOS-Intel.zip
          if-no-files-found: error

# ──────────────────────────────────────────────────────────────────
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git p7zip-full \
            libgtk-4-dev libadwaita-1-dev

      - name: Install natID SDK
        run: |
          git clone --depth 1 https://github.com/idzafic/natID.git $HOME/natID
          ln -s $HOME/natID/natID.SDK   $HOME/natID.SDK
          ln -s $HOME/natID/natID.Utils $HOME/natID.Utils
          curl -L -o /tmp/sdk-bin.7z \
            https://github.com/idzafic/natID/releases/download/v${SDK_VER}/bin_linux_x64_${SDK_DATE}.7z
          7z x -y -o$HOME/natID.SDK/bin /tmp/sdk-bin.7z
          ls $HOME/natID.SDK/bin/lib/

      - name: Setup RAMDisk and project symlink
        run: |
          mkdir -p $HOME/natID.RAMDisk/Out
          mkdir -p ~/Desktop
          ln -s "$GITHUB_WORKSPACE" ~/Desktop/TVDenoising

      - name: Build (Release)
        run: |
          cmake -S Implementation -B $HOME/natID.RAMDisk/build -DCMAKE_BUILD_TYPE=Release
          cmake --build $HOME/natID.RAMDisk/build -j$(nproc)

      - name: Collect installer (SetupCollector)
        run: |
          sudo rm -rf /media/RAMDisk
          sudo ln -s $HOME/natID.RAMDisk /media/RAMDisk
          cp -r $HOME/natID/natID.SDK/DevEnv/SetupCollectors $HOME/Setups
          cp "$GITHUB_WORKSPACE/packaging/TVDenoising.xml" $HOME/Setups/
          chmod +x $HOME/natID/natID.Utils/linux/SetupCollector
          $HOME/natID/natID.Utils/linux/SetupCollector $HOME/Setups/TVDenoising.xml
          find $HOME/natID.RAMDisk/Setup -maxdepth 4 2>/dev/null || echo "no Setup dir"

      - name: Stage and zip installer
        run: |
          mkdir -p "$GITHUB_WORKSPACE/installer-output"
          find $HOME/natID.RAMDisk/Setup -name "*.deb" -exec cp {} "$GITHUB_WORKSPACE/installer-output/" \; || true
          find $HOME/natID.RAMDisk/Setup -maxdepth 2 -type f ! -name "*.txt" \
            -exec cp {} "$GITHUB_WORKSPACE/installer-output/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/installer-output/"
          cd "$GITHUB_WORKSPACE"
          zip -j TVDenoising-linux.zip installer-output/*

      - uses: actions/upload-artifact@v4
        with:
          name: TVDenoising-linux
          path: TVDenoising-linux.zip
          if-no-files-found: error

# ──────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [windows, macos-silicon, macos-intel, linux]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'yes')
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: TV Image Denoising ${{ steps.tag.outputs.name }}
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | 🪟 Windows | `TVDenoising-win.zip` (contains installer `.exe` + `.msi` — keep both together) |
            | 🍎 macOS Apple Silicon | `TVDenoising-macOS-Silicon.zip` (M1/M2/M3/M4) |
            | 🍎 macOS Intel | `TVDenoising-macOS-Intel.zip` (2016–2020 Intel Macs) |
            | 🐧 Linux (Ubuntu 24.04+) | `TVDenoising-linux.zip` (contains `.deb`) |

            ## Install notes

            **Windows:** unzip, run the `.exe` (or `.msi` directly).

            **macOS:** unzip, drag `TVDenoising.app` to Applications.

            > ⚠️ **IMPORTANT:** Safari auto-extracts zips, re-applying the quarantine flag. After moving to Applications run:
            > ```
            > xattr -cr /Applications/TVDenoising.app
            > ```

            **Linux:** unzip, then `sudo apt install ./TVDenoising*.deb`
          files: |
            artifacts/TVDenoising-win/*
            artifacts/TVDenoising-macOS-Silicon/*
            artifacts/TVDenoising-macOS-Intel/*
            artifacts/TVDenoising-linux/*
