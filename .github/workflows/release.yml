name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME:   TVDenoising
  SDK_VER:    4.2.0
  SDK_DATE:   20260517   # date suffix in natIDSDKAllInOne filenames for v4.2.0

jobs:

# ──────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache natID SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: C:\natID.SDK
          key: natid-win-${{ env.SDK_VER }}

      - name: Download & extract natID SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/idzafic/natID/releases/download/v$env:SDK_VER/natIDSDKAllInOne_win_x64_$env:SDK_DATE.7z"
          Invoke-WebRequest -Uri $url -OutFile sdk.7z
          7z x sdk.7z -oC:\ -y
          Remove-Item sdk.7z

      - name: Create natID.RAMDisk
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\natID.RAMDisk\Out"

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Configure
        shell: pwsh
        run: |
          $env:USERPROFILE = "C:"
          cmake -S Implementation -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          $env:USERPROFILE = "C:"
          cmake --build build --config Release --parallel

      - name: Locate built exe
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem "C:\natID.RAMDisk\Out\$env:APP_NAME\Release" -Filter "*.exe" | Select-Object -First 1
          echo "EXE_DIR=C:\natID.RAMDisk\Out\$env:APP_NAME\Release" >> $env:GITHUB_ENV

      - name: Copy natID DLLs next to exe
        shell: pwsh
        run: |
          $sdkBin = "C:\natID.SDK\bin"
          Copy-Item "$sdkBin\*.dll"     $env:EXE_DIR -ErrorAction SilentlyContinue
          Copy-Item -Recurse "$sdkBin\GTK\bin\*.dll" $env:EXE_DIR -ErrorAction SilentlyContinue

      - name: CPack NSIS installer
        shell: pwsh
        run: |
          $env:USERPROFILE = "C:"
          cmake --build build --target package --config Release

      - name: Zip installer
        shell: pwsh
        run: |
          $files = Get-ChildItem build -Filter "TVDenoising-*.exe" -Recurse | Select-Object -ExpandProperty FullName
          if (-not $files) { $files = Get-ChildItem build -Include "*.exe" -Recurse | Where-Object { $_.Name -notlike "*cmake*" } | Select-Object -ExpandProperty FullName }
          Compress-Archive -Path $files -DestinationPath TVDenoising-win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: TVDenoising-win.zip

# ──────────────────────────────────────────────────────────────────
  build-macos-silicon:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache natID SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/natID.SDK
          key: natid-macos-arm64-${{ env.SDK_VER }}

      - name: Download & extract natID SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          brew install p7zip
          curl -L "https://github.com/idzafic/natID/releases/download/v${SDK_VER}/natIDSDKAllInOne_macOS_arm64_${SDK_DATE}.7z" -o sdk.7z
          7z x sdk.7z -o"${HOME}" -y
          rm sdk.7z

      - name: Create natID.RAMDisk
        run: mkdir -p ~/natID.RAMDisk/Out

      - name: Configure & Build
        run: |
          cmake -S Implementation -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --parallel

      - name: Bundle dylibs into .app
        run: |
          APP=$(find ~/natID.RAMDisk/Out/${APP_NAME}/Release -name "*.app" | head -1)
          FRAMEWORKS="${APP}/Contents/Frameworks"
          mkdir -p "${FRAMEWORKS}"
          cp ~/natID.SDK/bin/lib/*.dylib "${FRAMEWORKS}/" 2>/dev/null || true
          find "${FRAMEWORKS}" -name "*.dylib" -exec codesign --force --sign - {} \;
          codesign --force --sign - "${APP}"

      - name: Zip .app
        run: |
          APP=$(find ~/natID.RAMDisk/Out/${APP_NAME}/Release -name "*.app" | head -1)
          ditto -c -k --keepParent "${APP}" TVDenoising-macOS-Silicon.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-silicon
          path: TVDenoising-macOS-Silicon.zip

# ──────────────────────────────────────────────────────────────────
  build-macos-intel:
    name: macOS Intel
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Cache natID SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/natID.SDK
          key: natid-macos-x64-${{ env.SDK_VER }}

      - name: Download & extract natID SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          brew install p7zip
          curl -L "https://github.com/idzafic/natID/releases/download/v${SDK_VER}/natIDSDKAllInOne_macOS_x64_${SDK_DATE}.7z" -o sdk.7z
          7z x sdk.7z -o"${HOME}" -y
          rm sdk.7z

      - name: Create natID.RAMDisk
        run: mkdir -p ~/natID.RAMDisk/Out

      - name: Configure & Build
        run: |
          cmake -S Implementation -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --parallel

      - name: Bundle dylibs into .app
        run: |
          APP=$(find ~/natID.RAMDisk/Out/${APP_NAME}/Release -name "*.app" | head -1)
          FRAMEWORKS="${APP}/Contents/Frameworks"
          mkdir -p "${FRAMEWORKS}"
          cp ~/natID.SDK/bin/lib/*.dylib "${FRAMEWORKS}/" 2>/dev/null || true
          find "${FRAMEWORKS}" -name "*.dylib" -exec codesign --force --sign - {} \;
          codesign --force --sign - "${APP}"

      - name: Zip .app
        run: |
          APP=$(find ~/natID.RAMDisk/Out/${APP_NAME}/Release -name "*.app" | head -1)
          ditto -c -k --keepParent "${APP}" TVDenoising-macOS-Intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: TVDenoising-macOS-Intel.zip

# ──────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build p7zip-full \
            libgtk-3-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf2.0-dev \
            dpkg-dev fakeroot

      - name: Cache natID SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/natID.SDK
          key: natid-linux-x64-${{ env.SDK_VER }}

      - name: Download & extract natID SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -L "https://github.com/idzafic/natID/releases/download/v${SDK_VER}/natIDSDKAllInOne_linux_x64_${SDK_DATE}.7z" -o sdk.7z
          7z x sdk.7z -o"${HOME}" -y
          rm sdk.7z

      - name: Create natID.RAMDisk
        run: mkdir -p ~/natID.RAMDisk/Out

      - name: Configure & Build
        run: |
          cmake -S Implementation -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build --parallel

      - name: Package DEB
        run: |
          cd build
          cpack -G DEB -C Release

      - name: Zip .deb
        run: |
          DEB=$(ls build/*.deb | head -1)
          zip TVDenoising-linux.zip "${DEB}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: TVDenoising-linux.zip

# ──────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos-silicon, build-macos-intel, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: SHA-256 checksums
        id: sums
        run: |
          echo "win=$(sha256sum TVDenoising-win.zip           | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "sil=$(sha256sum TVDenoising-macOS-Silicon.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "int=$(sha256sum TVDenoising-macOS-Intel.zip   | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "lnx=$(sha256sum TVDenoising-linux.zip         | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=manual-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: TV Image Denoising ${{ steps.tag.outputs.name }}
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | 🪟 Windows | `TVDenoising-win.zip` (contains installer `.exe` — keep alongside `.msi` if present) |
            | 🍎 macOS Apple Silicon | `TVDenoising-macOS-Silicon.zip` (M1/M2/M3/M4) |
            | 🍎 macOS Intel | `TVDenoising-macOS-Intel.zip` (2016–2020 Intel Macs) |
            | 🐧 Linux (Ubuntu 24.04+) | `TVDenoising-linux.zip` (contains `.deb`) |

            ## Install notes

            **Windows:** unzip, run the `.exe`.

            **macOS:** unzip, drag `TVDenoising.app` to Applications.

            > ⚠️ **IMPORTANT:** Safari auto-extracts zips, re-applying the quarantine flag. After moving to Applications run:
            > ```
            > xattr -cr /Applications/TVDenoising.app
            > ```
            > No output = success. If you see "damaged or incomplete", run the command above.

            **Linux:** unzip, then `sudo apt install ./TVDenoising*.deb`

            ## SHA-256
            | File | sha256 |
            |---|---|
            | `TVDenoising-win.zip`           | `${{ steps.sums.outputs.win }}` |
            | `TVDenoising-macOS-Silicon.zip` | `${{ steps.sums.outputs.sil }}` |
            | `TVDenoising-macOS-Intel.zip`   | `${{ steps.sums.outputs.int }}` |
            | `TVDenoising-linux.zip`         | `${{ steps.sums.outputs.lnx }}` |
          files: |
            TVDenoising-win.zip
            TVDenoising-macOS-Silicon.zip
            TVDenoising-macOS-Intel.zip
            TVDenoising-linux.zip
